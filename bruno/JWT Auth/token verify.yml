info:
  name: token verify
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/token/verify/
  body:
    type: json
    data: |-
      {
        "token" : "{{jwt_access_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: http://localhost:8000/api/token/verify/
      method: POST
      body:
        type: json
        data: |-
          {
            "token" : "{{jwt_access_token}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: date
          value: Fri, 08 May 2026 05:41:49 GMT
        - name: server
          value: WSGIServer/0.2 CPython/3.12.10
        - name: content-type
          value: application/json
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY
        - name: content-length
          value: "2"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
      body:
        type: json
        data: "{}"
