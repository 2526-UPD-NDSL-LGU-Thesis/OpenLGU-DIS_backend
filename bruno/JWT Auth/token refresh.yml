info:
  name: token refresh
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/token/refresh/
  body:
    type: json
    data: |-
      {
        "refresh" : "{{jwt_refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setEnvVar("jwt_access_token", body.access);
        bru.setEnvVar("jwt_refresh_token", body.refresh);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Blacklisted token
    request:
      url: http://localhost:8000/api/token/refresh/
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh" : "{{jwt_refresh_token}}"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: date
          value: Sat, 02 May 2026 06:19:13 GMT
        - name: server
          value: WSGIServer/0.2 CPython/3.12.10
        - name: content-type
          value: application/json
        - name: www-authenticate
          value: Bearer realm="api"
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY
        - name: content-length
          value: "58"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
      body:
        type: json
        data: |-
          {
            "detail": "Token is blacklisted",
            "code": "token_not_valid"
          }
  - name: Success
    request:
      url: http://localhost:8000/api/token/refresh/
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh" : "{{jwt_refresh_token}}"
