info:
  name: ping
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8000/api/mosip/ping/
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: http://localhost:8000/api/mosip/ping/
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: date
          value: Sun, 17 May 2026 02:18:43 GMT
        - name: server
          value: WSGIServer/0.2 CPython/3.13.3
        - name: content-type
          value: application/json
        - name: vary
          value: Accept, origin
        - name: allow
          value: OPTIONS, GET
        - name: x-frame-options
          value: DENY
        - name: content-length
          value: "18"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
      body:
        type: json
        data: |-
          {
            "message": "pong"
          }
