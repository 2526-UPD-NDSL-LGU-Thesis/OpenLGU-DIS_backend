info:
  name: kyc via demographics
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/kyc/demo/
  headers:
    - name: Content-Type
      value: application/json
    - name: X-CSRFToken
      value: "{{CSRFToken}}"
  body:
    type: json
    data: |-
      {
        "uid" : "2047631038",
        "name" : "James Rodrigious",
        "dob" : "1992/04/29"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
