info:
  name: login
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/login/
  headers:
    - name: Content-Type
      value: application/json
    - name: X-CSRFToken
      value: "{{CSRFToken}}"
  body:
    type: json
    data: |-
      {
        "username" : "james",
        "password" : "rootroot"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookies = res.getHeader("set-cookie");

        let csrfToken = null;

        cookies.forEach(cookie => {
          if (cookie.startsWith("csrftoken=")) {
            csrfToken = cookie.split(";")[0].split("=")[1];
          }
        });

        if (csrfToken) {
          bru.setEnvVar("CSRFToken", csrfToken, { persist : true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
