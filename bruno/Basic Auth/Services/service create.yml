info:
  name: service create
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8000/api/services/
  headers:
    - name: Content-Type
      value: application/json
    - name: X-CSRFToken
      value: "{{CSRFToken}}"
  body:
    type: json
    data: |-
      {
        "name" : "GIVEAWAY",
        "verbose_name" : "1000 pcs Giveaway",
        "claim_type" : "onetime",
        "stocks_type" : "limited",
        "stocks" : 1000,
        "recepient_sectors" : ["RESIDENT"],
        "allowed_groups" : [1, 2]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
