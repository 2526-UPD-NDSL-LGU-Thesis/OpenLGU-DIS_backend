<!DOCTYPE html>
<html lang="en">
<head>
  <title>NDSG</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Your main styles -->
  <link rel="stylesheet" href="../static/css/styles.css">
  <!-- New modal/search styles -->
  <link rel="stylesheet" href="../static/css/profile.css">
</head>

<body>
  <nav>
    <img src="../static/img/clid-logo.png" alt="Logo" class="logo">
    Customizable LGU ID
    <a href="/auth">Authenticate</a>
    <a href="/profile">View Profile</a>
    <a href="/claim">Claim</a>
    <a href="/register">Register</a>
    <a href="/admin">(ADMIN)</a>
  </nav>

  <!-- Search Section -->
  <div id="search-container">
    <p>Enter LGU ID to search for user details.</p>
    <input type="text" id="searchID" placeholder="Enter LGU ID" value="{{ lgu_id|default:'' }}" />
    <button onclick="searchProfile()">Search</button>
  </div>

  <div class="profile-container">

    <!-- Profile Image -->
    <div class="image-section">
        <div class="profile-image">
            <img id="profileImg" alt="Profile Image">
        </div>

        <div class="verification-box">
            <span class="status not-verified" id="verifiedStatus">Not Verified</span>
        </div>
    </div>

    <!-- Info Section -->
    <div class="info-section">
        <h2>User Profile</h2>

        <div class="info-item">
            <span class="label">LGU ID:</span>
            <span class="value" id="lgu_id">LGU ID</span>
        </div>

        <div class="info-item">
            <span class="label">PhilSys ID:</span>
            <span class="value" id="pcn">PhilSys ID</span>
        </div>

        <div class="info-item">
            <span class="label">Date Issued:</span>
            <span class="value" id="issued_at">DATE</span>
        </div>

        <div class="buttons">
            <button class="btn view-more" onclick="openOTPModal()">View More</button>
        </div>
    </div>
  </div>

  <!-- OTP Modal -->
  <div class="modal" id="otpModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeOTPModal()">&times;</span>
      <h3>OTP Verification</h3>
      <p>Enter the OTP sent to the registered contact.</p>
      <input type="text" id="otpInput" placeholder="Enter OTP">
      <button onclick="verifyOTP()">Verify</button>
    </div>
  </div>

  <!-- JS -->
  <script src="../static/js/profile.js"></script>
</body>
</html>
