<!DOCTYPE html>
<html lang="en">
<head>
  <title>NDSG</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../static/css/styles.css">

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<header>
    <h2>Service Claim Portal</h2>
</header>

<div class="container">
    <div class="left-container">

        <!-- STEP 0: LOGIN -->
        <div id="step-login" class="step active">
            <h3>Login</h3>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn">Login</button>
        </div>

        <!-- NEW STEP 1: TABLE VIEW -->
        <div id="step-table" class="step">
            <h3>Available Claims</h3>
            <select id="claims-dropdown"></select>

            <table border="1" width="100%" style="margin-top: 15px; background: #fff;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Service</th>
                        <th>Claimed At</th>
                        <th>Claimed By</th>
                    </tr>
                </thead>
                <tbody id="claims-table-body">
                </tbody>
            </table>

            <button id="proceed-to-service-btn">Create New Claim</button>
        </div>

        <!-- STEP 2: SELECT SERVICE -->
        <div id="step-service" class="step">
            <h3>Select Service</h3>
            <select id="service-dropdown"></select>
            <button id="start-scan-btn">Start QR Scan</button>
        </div>

        <!-- STEP 3: QR SCAN -->
        <div id="step-scan" class="step">
            <h3>Scan QR</h3>
            <div id="qr-reader"></div>

            <label for="upload-qr" class="upload-label">Upload QR Image</label>
            <input type="file" id="upload-qr" accept="image/*">

            <label for="upload-philsys-qr" class="upload-label">Upload PhilSys QR</label>
            <input type="file" id="upload-philsys-qr" accept="image/*">
        </div>

        <!-- STEP 4: VERIFY FACE -->
        <div id="step-verify" class="step">
            <h3>Verify Face</h3>
            <img id="user-image" class="center-image">
            <div class="button-group">
                <button id="confirm-yes" class="success">Yes</button>
                <button id="confirm-no" class="danger">No</button>
            </div>
        </div>

        <!-- STEP 5: RESULT -->
        <div id="step-result" class="step">
            <h3>Result</h3>
            <div id="result-message"></div>
            <button id="new-claim-btn">New Claim</button>
        </div>

    </div>
</div>

<script src="../static/js/claim.js"></script>
</body>
</html>
